name: app_nupe
description: Um aplicativo para profissionais e alunos de saúde.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.9.1
  firebase_core_web: ^2.17.5
  google_sign_in: ^6.2.2
  cupertino_icons: ^1.0.6
  fl_chart: ^0.64.0 
  intl: ^0.18.1
  table_calendar: ^3.0.9
  uuid: ^4.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - lib/assets/cafe_manha.png
    - lib/assets/lanche_manha.png
    - lib/assets/almoco.png
    - lib/assets/jantar.png
    - lib/assets/ceia.png
    - lib/assets/calorias.png
    - lib/assets/proteina.png
    - lib/assets/gordura.png
    - lib/assets/carboidratos.png
    - lib/assets/agua.png
