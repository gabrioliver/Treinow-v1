name: app_nupe
description: Um aplicativo para profissionais e alunos de saúde.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2  # ou a versão mais recente

  # Firebase e Firestore
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_core_web: ^2.17.5 # opcional, útil pra web

  # Login com Google
  google_sign_in: ^6.2.2

  # Ícones iOS
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png
